# Where a matrix extension's facts are READ FROM — the entry points of the derivation, as data.
#
# WHY THIS FILE EXISTS. Every value the compiler needs about a matrix unit (instruction encodings, tile
# edge, operand alignment) is derived from the unit's own RTL rather than written down. But a derivation
# has to start somewhere: it has to know that the funct6 ordinals live in a ChiselEnum called `OPMFunct6`,
# that the instruction list is a Seq called `opuInsns`, that the vector length is the first argument of a
# mixin called `WithShuttleVectorUnit`. Those names are not derivable — they are the addresses of the facts.
#
# Spreading them across call sites is what makes code overfit to one unit: adding a second extension would
# mean editing shared Python instead of adding an entry here. So they live here, as data, and the code
# takes them as parameters. A different matrix unit is a new block below, not a new code path.
#
# WHAT IS NOT HERE. No encodings, no tile edges, no alignments, no mesh dimensions. Those are all read out
# of the sources named below at run time, and a value that cannot be read fails closed. If you find
# yourself wanting to add one, that is the signal that a derivation is missing — not that this file needs
# a default.
#
# The REVISION these paths are read at is declared separately, in hardware_pins.yaml, and named by `pin`.
# This file says where to look; that one says which checkout.
#
# Consumed by this package's `opu_shim.py` (via `matrix_lowering.py`) and `merlin.kernels.opu_cert`.
version: 1

units:

  saturn_opu:
    description: >-
      The outer-product matrix extension: four instructions in reserved even funct6 slots of the vector
      opcode, an int8 datapath accumulating in int32, and a tile whose edge is the vector unit's VLMAX at
      e8/m1.
    pin: saturn_opu_int8              # hardware_pins.yaml — the revision these paths are read at
    root_env: MERLIN_CHIPYARD
    path: generators/saturn

    # The Chisel sources the encoding derivation reads, relative to `path`.
    sources:
      consts: src/main/scala/common/Consts.scala
      instructions: src/main/scala/insns/Instructions.scala
      params: src/main/scala/common/Parameters.scala
      # A SECOND, independent statement of the same encodings, written by the unit's own author. The
      # derivation is cross-checked against it and a disagreement refuses to emit rather than picking a
      # side — one source could be stale and there is no way to tell which from one source alone.
      crosscheck_header: benchmarks/common/bme.h

    # The declaration names the derivation looks for. Chisel conventions, not values.
    declarations:
      funct6_enum: OPMFunct6          # ChiselEnum whose ORDINALS are the funct6 values
      consts_container: HasVectorConsts
      insn_seq: opuInsns              # the Seq naming which instructions the unit implements
      opcode_name: opcVector
      # Instantiation form -> the consts name holding that form's funct3. This is the one piece of
      # convention that is not itself written down in the sources, because the mapping lives in a class
      # definition rather than in a table.
      form_funct3:
        VV: OPMVV
        VX: OPMVX
      # RTL name -> cross-check header name. They differ: the RTL calls the accumulate OPMACC and the
      # header calls it VOPACC, which is exactly the kind of skew a cross-check exists to survive.
      crosscheck_pairs:
        OPMACC: VOPACC
        OPMVIN: VMV_RV
        OPMVINBCAST: OPMVINBCAST
        OPMVOUT: VMV_VR

    # Where the elaborated configurations are declared, and the mixin whose POSITIONAL arguments carry the
    # geometry. Binding by the mixin's own declared parameter names is what stops (vLen, dLen) being read
    # in the wrong order — a reversal that would give a plausible tile edge and a wrong alignment.
    #
    # TWO places, because a unit's configurations do not all live in one file. `config_scala` is the
    # extension's OWN generator, which declares the standalone configs (one core, the unit, nothing else).
    # `host_config_scala` is the integrating SoC's repo, which declares the heterogeneous ones that put the
    # unit on one tile beside something else — and those are the configs real bitstreams tend to be built
    # from, so leaving them out would mean the compiler could not target hardware that already exists.
    configs:
      config_scala:                     # relative to `path` (the unit's own checkout)
        - chipyard/OPUConfigs.scala
      host_config_scala:                # relative to `root_env` (the integrating SoC's root)
        - generators/chipyard/src/main/scala/config/HeteroConfigs.scala
      mixin_scala:
        - src/main/scala/shuttle/Configs.scala
        - src/main/scala/rocket/Configs.scala

    # The instruction roles the microkernel needs, by their RTL names. Which instruction plays which role
    # is a fact about the kernel's structure, not about the hardware, so it is stated rather than derived.
    kernel_roles:
      accumulate: OPMACC
      broadcast: OPMVINBCAST
      readout: OPMVOUT
      # The plain operand move-in. The microkernel's three roles above are the ones it EMITS in its inner
      # loop; this fourth one exists because a capsule's coverage expectation also has to name how an
      # operand reaches the unit, and a coverage list that omits the load is satisfied by a kernel that
      # never fetches anything.
      operand_load: OPMVIN

  saturn_vme:
    description: Signed int8 x int8 to int32 Zvt/VME matrix unit in the compact Kodiak
      configuration; geometry and instruction words are derived from pinned RTL.
    pin: saturn_vme_kodiak
    root_env: MERLIN_CHIPYARD
    path: generators/saturn
    sources:
      consts: src/main/scala/common/Consts.scala
      instructions: src/main/scala/insns/Instructions.scala
      params: src/main/scala/common/Parameters.scala
      crosscheck_header: benchmarks/common/vme.h
    core:
      pin: rocket_chip_kodiak_vme
      path: generators/rocket-chip
      source: src/main/scala/rocket/Matrix.scala
      container: MatrixInstructions
      instructions:
      - SF_MSETMTYPE
      - SF_VSETTN
      - SF_VSETTM
      - SF_VSETTK
      config_object: MatrixConfig
      kmax_def: kmax
    declarations:
      insn_seq: opuInsns
      consts_container: HasVectorConsts
      funct6_enum: OPMFunct6
      opcode_name: opcVector
      opcode_flags:
        OPVE: opcVectorE
      decode_fields:
        F6: funct6
        F3: funct3
        RS1: rs1
        RS2: rs2
      vtype_fields:
      - SEW
      form_funct3:
        VV: OPMVV
        VX: OPMVX
      matrix_types: opuMatrixTypes
      params_object: VectorParams
      enable_flag: useOpu
      crosscheck_pairs:
        SF_MM_INT: VME_MM_S_U
        SF_MM_FP8: VME_MM_E4_E4
        SF_VTMV_V_T: VME_VTMV_V_T
        SF_VTMV_T_V: VME_VTMV_T_V
        SF_VTZERO_T: VME_VTZERO
        SF_VTDISCARD: VME_VTDISCARD
        SF_MSETMTYPE: vme_msetmtype_raw
        SF_VSETTN: vme_vsettn
        SF_VSETTM: vme_vsettm
        SF_VSETTK: vme_vsettk
    configs:
      host_config_scala:
      - generators/firechip/chip/src/main/scala/TargetConfigs.scala
      mixin_scala:
      - src/main/scala/shuttle/Configs.scala
      - src/main/scala/rocket/Configs.scala
      config_scala:
      - chipyard/KodiakVMEConfigs.scala
    kernel_roles:
      matmul: SF_MM_INT
      zero: SF_VTZERO_T
      readout: SF_VTMV_V_T
      release: SF_VTDISCARD
      set_type: SF_MSETMTYPE
      set_n: SF_VSETTN
      set_m: SF_VSETTM
      set_k: SF_VSETTK
    operand_layout:
      mtype_widen_lsb: 0
      vtype_sew_lsb: 3
      vtype_altfmt_bit: 8
      tile_rd_shift: 3
      a_signed_rd_bit: 0
      tss_tile_lsb: 27
      tss_tile_scale: 4
      tss_pattern_lsb: 24
      tss_row_pattern: 0
      mstatus_ms_lsb: 29
      mstatus_ms_width: 2
    simulator:
      pin: spike_zvt
      binary_env: MERLIN_SPIKE_ZVT
      source_env: MERLIN_SPIKE_ZVT_SRC
      opcode_table: riscv/encoding.h
      opcode_pairs:
        SF_MM_INT: VTMMS_TVV
        SF_MM_FP8: VTFMM_TVV
        SF_VTMV_V_T: VTMV_V_T
        SF_VTMV_T_V: VTMV_T_V
        SF_VTZERO_T: VTZERO
        SF_VTDISCARD: VTDISCARD
        SF_MSETMTYPE: MSETMTYPE
        SF_VSETTN: MSETTN
        SF_VSETTM: MSETTM
        SF_VSETTK: MSETTK
      isa_extensions:
      - zvt{tile_edge}t
      - zvt8e
      - zvti8i32mm
    host:
      pin: chipyard_kodiak_vme
      source: generators/firechip/chip/src/main/scala/TargetConfigs.scala
